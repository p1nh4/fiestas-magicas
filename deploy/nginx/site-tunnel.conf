# ---------------------------------------------------------------------------
#  fiestasmagicasgalicia — nginx atrás de um túnel da Cloudflare
#
#  Variante do site.conf para uma máquina SEM IP público: um Raspberry Pi,
#  um mini-PC em casa, o WSL2 do portátil. Ver deploy/casa.md.
#
#  Troca DOMINIO.TLD pelo domínio real antes de usar.
#
#  Três diferenças em relação ao site.conf, e todas vêm da mesma coisa —
#  quem termina o TLS já não é este nginx, é a borda da Cloudflare, e o
#  pedido chega cá dentro pelo túnel:
#
#    1. Sem certificado e sem porta 443. O `cloudflared` corre nesta
#       máquina e fala com o nginx por HTTP em localhost.
#    2. Sem lista de intervalos da Cloudflare e sem `deny all`. Não fazem
#       falta: o nginx só escuta em 127.0.0.1, portanto de fora não há
#       porta nenhuma para bater. É mais fechado do que a variante com IP
#       público, não menos.
#    3. O `set_real_ip_from` passa a ser 127.0.0.1 — é de lá que o
#       `cloudflared` entrega o pedido.
# ---------------------------------------------------------------------------

server {
    # Só localhost. Se isto passar a 0.0.0.0, qualquer máquina na rede de
    # casa pode forjar o CF-Connecting-IP e escolher que IP o Laravel vê —
    # e lá se vai o throttle do formulário e o hashIp() dos leads.
    listen 127.0.0.1:8080;

    server_name DOMINIO.TLD www.DOMINIO.TLD;

    # ----------------------------------------------------------------
    #  Quem é o visitante.
    #
    #  A ligação vem sempre de 127.0.0.1 (o cloudflared, aqui ao lado).
    #  Confia-se nele — e só nele — para dizer, no CF-Connecting-IP, quem
    #  está do outro lado. A Cloudflare SUBSTITUI esse cabeçalho na borda,
    #  não o acrescenta, portanto não se forja de fora.
    #
    #  Primeiro a origem, só depois o cabeçalho. Ao contrário não vale nada.
    # ----------------------------------------------------------------
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   CF-Connecting-IP;
    real_ip_recursive off;

    root /var/www/fiestas/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-fiestas.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;

        # ------------------------------------------------------------
        #  A ligação até aqui é HTTP, mas o visitante veio por HTTPS: o
        #  túnel sai desta máquina já cifrado e a borda serve TLS. Sem
        #  estas duas linhas o Laravel acha que o pedido é inseguro e
        #  gera todos os links em http:// — com o "Always Use HTTPS"
        #  ligado, isso é um ciclo de redirecionamentos.
        #
        #  O SERVER_PORT não é enfeite: sem ele, o PHP vê 8080 e os
        #  endereços saem https://dominio.tld:8080/... — que é o que
        #  aparece no sitemap, nos emails e no link do orçamento.
        # ------------------------------------------------------------
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    access_log /var/log/nginx/fiestas.access.log;
    error_log  /var/log/nginx/fiestas.error.log warn;
}
