# ---------------------------------------------------------------------------
#  fiestasmagicasgalicia — nginx
#
#  Troca DOMINIO.TLD pelo domínio real (duas ocorrências) antes de usar.
#
#  A lista de intervalos da Cloudflare NÃO está aqui: vive em
#  /etc/nginx/conf.d/10-cloudflare.conf, escrita pelo
#  update-cloudflare-ips.sh e atualizada semanalmente. Ter uma lista de
#  IPs colada à mão dentro de um ficheiro de configuração é ter uma lista
#  que um dia fica velha e ninguém repara.
# ---------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;
    server_name DOMINIO.TLD;

    # A Cloudflare já força HTTPS na borda; isto é só a rede de segurança.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name DOMINIO.TLD;

    # Certificado de origem da Cloudflare: válido 15 anos, só aceite por
    # ela. Exige o modo "Full (strict)" no painel.
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ----------------------------------------------------------------
    #  Só a Cloudflare entra.
    #
    #  O include traz os `set_real_ip_from` E os `allow`. O `deny all`
    #  fecha a porta a quem descobrir o IP da máquina e tentar ligar-se
    #  por fora — que é como se contorna tudo o que a Cloudflare faz.
    #
    #  Confirma com:
    #    curl -sI --resolve DOMINIO.TLD:443:IP_DA_MAQUINA https://DOMINIO.TLD
    #  Tem de dar 403.
    # ----------------------------------------------------------------
    include /etc/nginx/conf.d/10-cloudflare.conf;
    deny all;

    root /var/www/fiestas/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Cabeçalhos que a aplicação não pode garantir sozinha. Os outros
    # (CSP, Referrer-Policy) já vêm do middleware do Laravel — e há um
    # teste que falha se desaparecerem.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compressão. O brotli exigia um módulo extra; o gzip chega e é o que
    # vem na caixa.
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Os ficheiros do Vite trazem hash no nome, portanto podem ser
    # guardados para sempre: quando o conteúdo muda, muda o nome.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|webp|avif|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm-fiestas.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;

        # Nada de trustProxies no Laravel: quando este pedido chega aqui, o
        # $remote_addr JÁ é o IP verdadeiro do visitante (o real_ip_module
        # tratou disso) e o $https já diz se veio por TLS. Uma única
        # autoridade sobre quem é o cliente, e é o nginx.
    }

    # Um pedido a /.env ou /.git não é um engano de alguém: é alguém à
    # procura. Fecha-se sem responder.
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { try_files $uri /index.php?$query_string; }

    error_page 404 /index.php;

    access_log /var/log/nginx/fiestas.access.log;
    error_log  /var/log/nginx/fiestas.error.log warn;
}
