; Pool do PHP-FPM da aplicação.
;
; Substitui o pool `www` que vem por omissão. Socket próprio, para o nginx
; falar só com este pool e para os logs saírem separados.

[fiestas]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-fiestas.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ondemand em vez de dynamic: numa máquina pequena com pouco tráfego não
; vale a pena ter processos parados a ocupar memória. O primeiro pedido
; depois de um período parado paga uns milissegundos a mais.
pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Um processo que passe de 60 s está preso, não está lento. Mata-se e
; escreve-se o rasto no log, em vez de acumular processos pendurados.
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/log/php8.4-fpm-fiestas.slow.log

catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.4-fpm-fiestas.error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 256M

; A aplicação não precisa de correr programas nem de abrir URLs como se
; fossem ficheiros. Fechar isto tira das mãos de quem encontrar uma falha
; as duas ferramentas mais úteis que existem.
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen
php_admin_flag[allow_url_fopen] = off
